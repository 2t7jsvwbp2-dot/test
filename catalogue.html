<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogue · Bavaria Parts</title>
  <meta name="description" content="Toutes les pièces détachées pour BMW : filtrez par modèle, catégorie, marque et prix.">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="catalogue">
  <main id="main" class="container page">
    <nav class="breadcrumb" aria-label="Fil d'Ariane"><a href="index.html">Accueil</a><span id="crumb">Catalogue</span></nav>
    <div class="page__head">
      <h1 id="catalogTitle">Catalogue</h1>
      <p class="muted" id="resultCount"></p>
    </div>

    <div class="catalog">
      <details class="filters" id="filtersPanel" open>
        <summary>Filtres</summary>
        <form id="filters" class="filters__form">
          <div class="filter-group">
            <label for="fModel" class="filter-group__title">Modèle</label>
            <select id="fModel" name="modele"><option value="">Tous les modèles</option></select>
          </div>
          <fieldset class="filter-group">
            <legend class="filter-group__title">Catégorie</legend>
            <label class="check"><input type="radio" name="categorie" value="" checked> Toutes</label>
            <div id="fCategories"></div>
          </fieldset>
          <fieldset class="filter-group">
            <legend class="filter-group__title">Marque</legend>
            <div id="fBrands"></div>
          </fieldset>
          <div class="filter-group">
            <label for="fPrice" class="filter-group__title">Prix maximum : <span id="fPriceValue"></span></label>
            <input type="range" id="fPrice" name="prix" min="10" max="650" step="10">
          </div>
          <fieldset class="filter-group">
            <legend class="filter-group__title">Disponibilité</legend>
            <label class="check"><input type="checkbox" name="stock" id="fStock"> En stock uniquement</label>
            <label class="check"><input type="checkbox" name="promo" id="fPromo"> En promotion</label>
          </fieldset>
          <button type="button" class="btn btn--ghost btn--block" id="resetFilters">Réinitialiser les filtres</button>
        </form>
      </details>

      <div class="catalog__main">
        <div class="catalog__bar">
          <div class="active-filters" id="activeFilters"></div>
          <label class="sort">Trier par
            <select id="sort">
              <option value="popularite">Popularité</option>
              <option value="prix-asc">Prix croissant</option>
              <option value="prix-desc">Prix décroissant</option>
              <option value="nom">Nom A → Z</option>
            </select>
          </label>
        </div>
        <div class="product-grid product-grid--3" id="productGrid"></div>
        <div class="empty" id="emptyState" hidden>
          <h2>Aucune pièce ne correspond</h2>
          <p>Essayez d'élargir vos filtres, ou envoyez-nous la référence recherchée : nous pouvons souvent la commander sous 48h.</p>
          <p><button class="btn btn--ghost" id="emptyReset">Réinitialiser les filtres</button> <a class="btn btn--primary" href="contact.html">Demander une pièce</a></p>
        </div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
