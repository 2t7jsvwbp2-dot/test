<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · Bois & Braise</title>
  <meta name="description" content="Une question sur le bois, une livraison ou une commande ? Contactez-nous.">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
  <main id="main" class="container page">
    <nav class="breadcrumb" aria-label="Fil d'Ariane"><a href="index.html">Accueil</a><span>Contact</span></nav>
    <h1>Nous contacter</h1>
    <div class="contact-grid">
      <form class="panel" id="contactForm" novalidate>
        <div class="form-grid">
          <div class="field"><label for="cName">Nom</label><input id="cName" name="name" required autocomplete="name" data-error="Indiquez votre nom."></div>
          <div class="field"><label for="cEmail">E-mail</label><input id="cEmail" name="email" type="email" required autocomplete="email" data-error="Indiquez une adresse e-mail valide."></div>
          <div class="field"><label for="cPhone">Téléphone <span class="muted">(facultatif)</span></label><input id="cPhone" name="phone" type="tel" autocomplete="tel"></div>
          <div class="field"><label for="cZip">Code postal <span class="muted">(facultatif)</span></label><input id="cZip" name="zip" inputmode="numeric" maxlength="5" autocomplete="postal-code"></div>
          <div class="field span-2"><label for="cSubject">Sujet</label>
            <select id="cSubject" name="subject">
              <option>Demande de devis (gros volume, professionnel)</option>
              <option>Question sur le bois</option>
              <option>Livraison</option>
              <option>Question sur une commande</option>
              <option>Paiement, chèque énergie</option>
              <option>Autre demande</option>
            </select>
          </div>
          <div class="field span-2"><label for="cOrder">N° de commande <span class="muted">(facultatif)</span></label><input id="cOrder" name="ref" autocomplete="off"></div>
          <div class="field span-2"><label for="cMessage">Message</label><textarea id="cMessage" name="message" rows="6" required data-error="Écrivez votre message."></textarea></div>
        </div>
        <button class="btn btn--primary btn--lg" type="submit">Envoyer le message</button>
        <div id="contactResult" role="status"></div>
      </form>
      <aside class="panel panel--soft">
        <h2 class="h3">Coordonnées</h2>
        <dl class="info-list">
          <div><dt>E-mail</dt><dd class="selectable" data-shop="email"></dd></div>
          <div><dt>Téléphone</dt><dd class="selectable" data-shop="phone"></dd></div>
          <div><dt>Dépôt</dt><dd data-shop="address"></dd></div>
          <div><dt>Horaires</dt><dd data-shop="hours"></dd></div>
        </dl>
        <h2 class="h3">Gros volumes</h2>
        <p class="small">Au-delà de 15 stères, pour une collectivité, un gîte ou un restaurant, demandez-nous un devis : tarif dégressif et livraison en semi-remorque possible.</p>
      </aside>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
